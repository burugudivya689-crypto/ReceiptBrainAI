# Activate with: SPRING_PROFILES_ACTIVE=mysql
# Supply these values as environment variables in deployment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/receiptbrain}
spring.datasource.username=${DB_USERNAME:receiptbrain}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
