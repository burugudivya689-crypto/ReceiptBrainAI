spring.application.name=receiptbrain-ai
spring.datasource.url=jdbc:h2:mem:receiptbrain;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.jwt.secret=${APP_JWT_SECRET:receiptbrain-super-secret-key-change-me-in-production}
app.jwt.expiration-ms=86400000
app.upload.dir=${UPLOAD_DIR:uploads}
server.port=${PORT:8081}
server.forward-headers-strategy=framework
logging.level.org.springframework.security=INFO
spring.profiles.default=dev
