# Free Supabase PostgreSQL profile. Activate with SPRING_PROFILES_ACTIVE=postgres.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Supabase Storage configuration. Leave blank for local development.
app.storage.supabase-url=${SUPABASE_URL:}
app.storage.service-key=${SUPABASE_SERVICE_KEY:}
app.storage.bucket=${SUPABASE_BUCKET:receipts}
